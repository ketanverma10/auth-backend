services:
  postgres:
    image: postgres:18
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql

volumes:
  auth-postgres-data:
    name: auth-postgres-data
